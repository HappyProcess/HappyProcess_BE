spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      data-source-properties:
        prepareThreshold: 0
        preparedStatementCacheQueries: 0

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.PostgreSQLDialect

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 30MB

server:
  port: 8080

jwt:
  secret: ${JWT_SECRET}
  access-expiration: ${JWT_ACCESS_EXPIRATION}
  refresh-expiration: ${JWT_REFRESH_EXPIRATION}

supabase:
  url: ${SUPABASE_URL}
  service-key: ${SUPABASE_SERVICE_KEY}
  bucket: ${SUPABASE_BUCKET:post-images}

weather:
  api:
    key: ${WEATHER_API_KEY}
    urls:
      forecast: "https://apis.data.go.kr/1360000/VilageFcstInfoService_2.0"
      air-pollution: "https://apis.data.go.kr/B552584/ArpltnInforInqireSvc"
      pollen: "https://apis.data.go.kr/1360000/HealthWthrIdxServiceV3"
      living: "https://apis.data.go.kr/1360000/LivingWthrIdxServiceV4"